name: Validate app syntax
# Also validates the latest app.py contents after budget persistence changes.

on:
  push:
    paths:
      - "app.py"
      - ".github/workflows/validate-app-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Compile Python file
        run: python -m py_compile app.py
