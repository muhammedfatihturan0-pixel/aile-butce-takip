name: Streamlit Keep Alive

on:
  schedule:
    # GitHub Actions cron uses UTC. Runs every 6 hours.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Streamlit app
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "https://butceai.streamlit.app/"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; StreamlitKeepAlive/1.0)"}

          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(request, timeout=25) as response:
                      print(f"HTTP {response.status} - {url}")
                      body = response.read(30000).decode("utf-8", errors="ignore")
                      if "Wake up" in body or "wake up" in body:
                          print("App sleep page detected; request sent to wake endpoint.")
                      break
              except Exception as error:
                  print(f"Attempt {attempt + 1}/3 failed: {error}")
                  if attempt < 2:
                      time.sleep(10)
          PY
